# 与 Settings → Pages「Deploy from a branch → main → /(root)」配合
# 将 tesseract 构建产物提交到 main 根目录
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tesseract/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tesseract/package-lock.json

      - name: Install and build
        working-directory: tesseract
        run: |
          npm ci
          npm run build:pages

      - name: Publish build to repository root
        run: |
          set -euo pipefail
          rm -rf assets
          rm -f index.html favicon.svg icons.svg .nojekyll
          # dist/* 不包含 .nojekyll 等隐藏文件，必须用 dist/.
          cp -r tesseract/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets favicon.svg icons.svg .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "chore(pages): deploy site to main root [skip ci]"
          git push origin main
