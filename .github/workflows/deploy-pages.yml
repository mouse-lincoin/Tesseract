# 将构建产物推送到 gh-pages 分支（无需在 Settings 里选 GitHub Actions 源）
# 首次使用：Settings → Pages → Source 选「Deploy from a branch」→ gh-pages → /(root)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tesseract/package-lock.json

      - name: Install and build
        working-directory: tesseract
        run: |
          npm ci
          npm run build:pages

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tesseract/dist
          force_orphan: true
